[package]
name = "rust-player"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
rodio = "0.21"
lofty = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
rand = "0.9"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
encoding_rs = "0.8"
url = "2"
rhai = { version = "1.23", default-features = false, features = ["std", "no_module", "no_float", "no_time"] }
ttf-parser = "0.25"

raw-window-handle = "0.6"
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
