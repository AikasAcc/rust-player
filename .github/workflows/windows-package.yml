name: Windows package artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, e.g. v0.6.0-rc2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checks and ZIP with checksum
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: ./scripts/package-release.ps1 -Version $env:VERSION
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: |
            target/release-package/*/*.zip
            target/release-package/*/*.sha256
          if-no-files-found: error
