name: Deploy theme gallery

on:
  push:
    branches: [main]
    paths:
      - theme-gallery/**
      - .github/workflows/deploy-theme-gallery.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: theme-gallery
      - id: deployment
        uses: actions/deploy-pages@v4

