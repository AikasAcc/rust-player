name: Feature request
description: Suggest an improvement to Rust Player.
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
